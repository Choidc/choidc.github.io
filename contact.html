<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Contact - Dochan Choi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #222222;
      --accent-color: #0047FF;
    }

    body.dark {
      --bg-color: #111111;
      --text-color: #eeeeee;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }

    nav {
      background: var(--bg-color);
      border-bottom: 1px solid #ddd;
      padding: 1rem;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
      color: var(--text-color);
    }

    .toggle-btn {
      position: absolute;
      right: 20px;
      top: 14px;
      padding: 6px 12px;
      font-size: 0.9rem;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .hero {
      height: 40vh;
      background: linear-gradient(to right, var(--accent-color), #0099FF);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 2rem;
    }

    .hero h1 {
      font-size: 3rem;
    }

    .contact-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      align-items: flex-start;
    }

    .contact-info {
      flex: 1 1 300px;
    }

    .contact-info p {
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    form {
      flex: 1 1 400px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input,
    textarea {
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }

    button {
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: bold;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 40px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Info</a>
    <a href="experience.html">Experience</a>
    <a href="shader.html">Shader Viewer</a>
    <a href="contact.html">Contact</a>
    <button class="toggle-btn" id="darkToggle">Toggle Dark Mode</button>
  </nav>

  <div class="hero">
    <h1>Contact</h1>
  </div>

  <div class="contact-container">
    <div class="contact-info">
      <p><strong>Dochan Choi</strong></p>
      <p>San Diego, CA, USA</p>
      <p>(KR) +82 10-8785-1946<br>(US) +1 858-257-9740</p>
      <p>ehcks304@naver.com</p>
    </div>

    <form>
      <input type="text" name="firstname" placeholder="First Name" required />
      <input type="text" name="lastname" placeholder="Last Name" required />
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="message" rows="5" placeholder="Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Dochan Choi. All rights reserved.
  </footer>

  <script>
    document.getElementById('darkToggle').addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });
  </script>
</body>

</html>
